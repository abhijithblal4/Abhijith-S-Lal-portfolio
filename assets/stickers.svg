<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Pixel Heart -->
    <g id="sticker-pixel-heart">
      <path d="M 4 2 H 8 V 0 H 14 V 2 H 18 V 6 H 14 V 8 H 8 V 6 H 4 Z" fill="#EF4444" transform="scale(3)" />
    </g>

    <!-- Coffee Mug Sticker -->
    <g id="sticker-coffee">
      <rect x="12" y="18" width="34" height="36" rx="6" fill="#F59E0B" stroke="#78350F" stroke-width="2.5" />
      <path d="M 46 26 C 54 26 54 44 46 44" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
      <path d="M 22 10 Q 24 6 26 10 T 30 10" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 32 10 Q 34 6 36 10 T 40 10" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Smiley Sun -->
    <g id="sticker-sun">
      <circle cx="32" cy="32" r="18" fill="#FBBF24" stroke="#D97706" stroke-width="2.5" />
      <!-- Rays -->
      <line x1="32" y1="4" x2="32" y2="10" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
      <line x1="32" y1="54" x2="32" y2="60" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
      <line x1="4" y1="32" x2="10" y2="32" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
      <line x1="54" y1="32" x2="60" y2="32" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
      <!-- Eyes & Smile -->
      <circle cx="26" cy="30" r="2.5" fill="#78350F" />
      <circle cx="38" cy="30" r="2.5" fill="#78350F" />
      <path d="M 26 38 Q 32 43 38 38" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Retro Lightning Bolt -->
    <g id="sticker-bolt">
      <polygon points="34,6 16,34 30,34 22,58 48,24 34,24" fill="#FBBF24" stroke="#1F2937" stroke-width="2.5" stroke-linejoin="round" />
    </g>

    <!-- Chicago Star -->
    <g id="sticker-star">
      <polygon points="32,8 38,24 55,24 41,34 47,50 32,40 17,50 23,34 9,24 26,24" fill="#EF4444" stroke="#991B1B" stroke-width="2" stroke-linejoin="round" />
    </g>
  </defs>
</svg>