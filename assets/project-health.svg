<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <!-- Zenith Clinical EHR UI Preview -->
  <rect width="600" height="380" rx="16" fill="#F1F5F9" />

  <!-- Left Sidebar Nav -->
  <rect x="20" y="20" width="60" height="340" rx="12" fill="#0F172A" />
  <circle cx="50" cy="50" r="14" fill="#0EA5E9" />
  <rect x="36" y="86" width="28" height="6" rx="3" fill="#334155" />
  <rect x="36" y="110" width="28" height="6" rx="3" fill="#38BDF8" />
  <rect x="36" y="134" width="28" height="6" rx="3" fill="#334155" />
  <rect x="36" y="158" width="28" height="6" rx="3" fill="#334155" />
  <circle cx="50" cy="330" r="12" fill="#334155" />

  <!-- Main Patient Header -->
  <g transform="translate(100, 20)">
    <rect width="480" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="36" cy="32" r="18" fill="#E0F2FE" />
    <text x="31" y="37" fill="#0284C7" font-size="14" font-family="sans-serif" font-weight="bold">JD</text>
    <text x="68" y="28" fill="#0F172A" font-size="13" font-family="sans-serif" font-weight="bold">Davis, Julian (M, 46)</text>
    <text x="68" y="44" fill="#64748B" font-size="10" font-family="sans-serif">MRN: 884-209 • Room 402-B • Dr. Morrison</text>
    <rect x="360" y="20" width="100" height="24" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <text x="375" y="36" fill="#DC2626" font-size="10" font-family="sans-serif" font-weight="bold">● Penicillin Allergy</text>
  </g>

  <!-- Live Vitals Monitoring Card -->
  <g transform="translate(100, 96)">
    <rect width="320" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="20" y="28" fill="#0F172A" font-size="12" font-family="sans-serif" font-weight="bold">Continuous Hemodynamics</text>
    <rect x="230" y="14" width="75" height="20" rx="10" fill="#ECFDF5" />
    <text x="242" y="28" fill="#059669" font-size="9" font-family="sans-serif" font-weight="bold">Stable • 120/80</text>
    
    <!-- Heartbeat waveform -->
    <path d="M 20 85 L 80 85 L 90 60 L 98 115 L 106 45 L 114 95 L 122 80 L 130 85 L 200 85 L 210 60 L 218 115 L 226 45 L 234 95 L 242 80 L 250 85 L 300 85" 
          stroke="#0EA5E9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stat pills below -->
    <g transform="translate(20, 105)">
      <text x="0" y="14" fill="#64748B" font-size="9" font-family="sans-serif">HR</text>
      <text x="0" y="32" fill="#0EA5E9" font-size="16" font-family="sans-serif" font-weight="bold">72 bpm</text>

      <text x="80" y="14" fill="#64748B" font-size="9" font-family="sans-serif">SpO2</text>
      <text x="80" y="32" fill="#10B981" font-size="16" font-family="sans-serif" font-weight="bold">99%</text>

      <text x="160" y="14" fill="#64748B" font-size="9" font-family="sans-serif">Resp</text>
      <text x="160" y="32" fill="#8B5CF6" font-size="16" font-family="sans-serif" font-weight="bold">16 /min</text>

      <text x="230" y="14" fill="#64748B" font-size="9" font-family="sans-serif">Temp</text>
      <text x="230" y="32" fill="#F59E0B" font-size="16" font-family="sans-serif" font-weight="bold">98.6°F</text>
    </g>
  </g>

  <!-- Medication & Orders Right Column -->
  <g transform="translate(434, 96)">
    <rect width="146" height="264" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="14" y="28" fill="#0F172A" font-size="11" font-family="sans-serif" font-weight="bold">Pending Orders (3)</text>
    
    <rect x="12" y="44" width="122" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="20" y="62" fill="#0F172A" font-size="10" font-family="sans-serif" font-weight="bold">Ceftriaxone IV</text>
    <text x="20" y="76" fill="#64748B" font-size="8" font-family="sans-serif">1g every 24h</text>
    <rect x="20" y="84" width="50" height="14" rx="4" fill="#E0F2FE" />
    <text x="25" y="94" fill="#0284C7" font-size="7" font-family="sans-serif" font-weight="bold">Due 14:00</text>

    <rect x="12" y="114" width="122" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="20" y="132" fill="#0F172A" font-size="10" font-family="sans-serif" font-weight="bold">BMP Lab Panel</text>
    <text x="20" y="146" fill="#64748B" font-size="8" font-family="sans-serif">Stat Blood Draw</text>
    <rect x="20" y="154" width="58" height="14" rx="4" fill="#FEF3C7" />
    <text x="25" y="164" fill="#D97706" font-size="7" font-family="sans-serif" font-weight="bold">Collecting</text>

    <rect x="12" y="184" width="122" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="20" y="202" fill="#0F172A" font-size="10" font-family="sans-serif" font-weight="bold">Chest X-Ray AP</text>
    <text x="20" y="216" fill="#64748B" font-size="8" font-family="sans-serif">Portable Unit</text>
  </g>

  <!-- Redesigned 1-Click Charting Bar -->
  <g transform="translate(100, 258)">
    <rect width="320" height="102" rx="12" fill="#0F172A" />
    <text x="20" y="30" fill="#F8FAFC" font-size="11" font-family="sans-serif" font-weight="bold">⚡ Quick Note & Voice Dictation</text>
    <rect x="20" y="46" width="280" height="40" rx="8" fill="#1E293B" />
    <circle cx="40" cy="66" r="10" fill="#EF4444" />
    <text x="60" y="70" fill="#94A3B8" font-size="9" font-family="sans-serif">"Lungs clear to auscultation bilaterally..."</text>
  </g>
</svg>