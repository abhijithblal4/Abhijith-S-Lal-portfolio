  <!-- Interactive Contrast Wave Analyzer -->
  <g transform="translate(40, 230)">
    <rect width="520" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#F8FAFC" font-size="12" font-family="sans-serif" font-weight="bold">Luminance Harmonizer (APCA & WCAG 3.0)</text>
    
    <!-- Wave line -->
    <path d="M 20 75 Q 80 40 140 70 T 260 70 T 380 70 T 500 70" stroke="url(#spectrum1)" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="200" cy="70" r="7" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" />
    <rect x="175" y="85" width="50" height="18" rx="4" fill="#8B5CF6" />
    <text x="183" y="97" fill="#FFFFFF" font-size="8" font-family="sans-serif" font-weight="bold">Lc 75.4</text>
  </g>
