<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <!-- Canvas Flow Infinite Collaboration UI -->
  <rect width="600" height="380" rx="16" fill="#F8FAFC" />
  
  <defs>
    <!-- Dot grid -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#CBD5E1" />
    </pattern>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#dotGrid)" />

  <!-- Top Canvas Toolbar -->
  <g transform="translate(180, 16)">
    <rect width="240" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="24" cy="19" r="6" fill="#64748B" />
    <rect x="42" y="13" width="12" height="12" rx="2" fill="#3B82F6" />
    <circle cx="76" cy="19" r="6" stroke="#64748B" stroke-width="1.5" fill="none" />
    <rect x="96" y="13" width="14" height="12" rx="2" fill="#E2E8F0" />
    <rect x="130" y="12" width="1" height="14" fill="#E2E8F0" />
    <!-- User Presence Avatars -->
    <circle cx="170" cy="19" r="10" fill="#EF4444" />
    <circle cx="186" cy="19" r="10" fill="#10B981" />
    <circle cx="202" cy="19" r="10" fill="#8B5CF6" />
  </g>

  <!-- Wireframe Artboard on Canvas -->
  <g transform="translate(80, 80)">
    <rect width="260" height="240" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="12" y="24" fill="#64748B" font-size="11" font-family="sans-serif" font-weight="600">Dashboard / Checkout v3</text>
    <rect x="12" y="38" width="80" height="30" rx="4" fill="#F1F5F9" />
    <rect x="100" y="38" width="148" height="30" rx="4" fill="#F1F5F9" />
    <rect x="12" y="80" width="236" height="80" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="36" cy="120" r="14" fill="#3B82F6" fill-opacity="0.2" />
    <rect x="62" y="112" width="110" height="8" rx="2" fill="#94A3B8" />
    <rect x="62" y="124" width="70" height="6" rx="2" fill="#CBD5E1" />
    <rect x="12" y="174" width="112" height="40" rx="4" fill="#F1F5F9" />
    <rect x="136" y="174" width="112" height="40" rx="4" fill="#F1F5F9" />
  </g>

  <!-- Colorful Sticky Notes on Canvas -->
  <g transform="translate(370, 90) rotate(3)">
    <rect width="130" height="110" rx="4" fill="#FEF08A" stroke="#FDE047" stroke-width="1" />
    <rect x="14" y="20" width="100" height="6" rx="2" fill="#854D0E" fill-opacity="0.7" />
    <rect x="14" y="34" width="90" height="6" rx="2" fill="#854D0E" fill-opacity="0.7" />
    <rect x="14" y="48" width="70" height="6" rx="2" fill="#854D0E" fill-opacity="0.7" />
    <text x="14" y="94" fill="#854D0E" font-size="9" font-family="sans-serif" font-weight="bold">Elena (PM) • 2m ago</text>
  </g>

  <g transform="translate(380, 220) rotate(-4)">
    <rect width="140" height="110" rx="4" fill="#BBF7D0" stroke="#86EFAC" stroke-width="1" />
    <rect x="14" y="20" width="110" height="6" rx="2" fill="#14532D" fill-opacity="0.7" />
    <rect x="14" y="34" width="95" height="6" rx="2" fill="#14532D" fill-opacity="0.7" />
    <rect x="14" y="48" width="80" height="6" rx="2" fill="#14532D" fill-opacity="0.7" />
    <text x="14" y="94" fill="#14532D" font-size="9" font-family="sans-serif" font-weight="bold">Robin • Approved ✓</text>
  </g>

  <!-- Live Multi-player Cursors -->
  <!-- Cursor 1 (Purple) -->
  <g transform="translate(240, 210)">
    <path d="M 0 0 L 0 16 L 4 12 L 8 20 L 11 18 L 7 10 L 13 10 Z" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.2" />
    <rect x="14" y="12" width="60" height="18" rx="4" fill="#8B5CF6" />
    <text x="18" y="24" fill="#FFFFFF" font-size="9" font-family="sans-serif" font-weight="bold">Sarah M.</text>
  </g>

  <!-- Cursor 2 (Red) -->
  <g transform="translate(420, 150)">
    <path d="M 0 0 L 0 16 L 4 12 L 8 20 L 11 18 L 7 10 L 13 10 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.2" />
    <rect x="14" y="12" width="54" height="18" rx="4" fill="#EF4444" />
    <text x="18" y="24" fill="#FFFFFF" font-size="9" font-family="sans-serif" font-weight="bold">Alex D.</text>
  </g>
</svg>